name: autorelease

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-apply:
    name: home apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Link checkout as the dotfiles root
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Install dconf
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y dconf-cli

      - name: Apply home
        run: dbus-run-session -- ./setup home apply
